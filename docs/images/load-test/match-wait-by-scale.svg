<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">規模ごとのマッチ成立までの待ち時間</title>
<desc id="d">40/400/1,000 VU それぞれの待ち時間 p50 と p95（秒）</desc>
<style>
  svg { font-family: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif; }
  .surface { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; }
  .t2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ref { stroke: #52514e; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s1l { stroke: #2a78d6; }
  .s2 { fill: #eb6834; } .s2l { stroke: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .t1 { fill: #ffffff; }
    .t2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .ref { stroke: #c3c2b7; }
    .s1 { fill: #3987e5; } .s1l { stroke: #3987e5; }
    .s2 { fill: #d95926; } .s2l { stroke: #d95926; }
    .ring { stroke: #1a1a19; }
  }
</style>
<rect class="surface" width="640" height="340" rx="8"/>
<text x="24.0" y="34.0" class="t1" font-size="16" text-anchor="start" font-weight="600">規模ごとのマッチ成立までの待ち時間</text>
<text x="24.0" y="54.0" class="t2" font-size="12" text-anchor="start" font-weight="400">API の応答は速いままでも、人数が増えるほど 4 人そろうまでの待ちが伸びる</text>
<rect class="s1" x="490" y="64" width="12" height="12" rx="2"/>
<text x="508.0" y="75.0" class="t2" font-size="12" text-anchor="start" font-weight="400">p50</text>
<rect class="s2" x="550" y="64" width="12" height="12" rx="2"/>
<text x="568.0" y="75.0" class="t2" font-size="12" text-anchor="start" font-weight="400">p95</text>
<line class="grid" x1="70" x2="610" y1="284.0" y2="284.0"/>
<text x="62.0" y="288.0" class="muted" font-size="11" text-anchor="end" font-weight="400">0 秒</text>
<line class="grid" x1="70" x2="610" y1="245.2" y2="245.2"/>
<text x="62.0" y="249.2" class="muted" font-size="11" text-anchor="end" font-weight="400">10 秒</text>
<line class="grid" x1="70" x2="610" y1="206.4" y2="206.4"/>
<text x="62.0" y="210.4" class="muted" font-size="11" text-anchor="end" font-weight="400">20 秒</text>
<line class="grid" x1="70" x2="610" y1="167.6" y2="167.6"/>
<text x="62.0" y="171.6" class="muted" font-size="11" text-anchor="end" font-weight="400">30 秒</text>
<line class="grid" x1="70" x2="610" y1="128.8" y2="128.8"/>
<text x="62.0" y="132.8" class="muted" font-size="11" text-anchor="end" font-weight="400">40 秒</text>
<line class="grid" x1="70" x2="610" y1="90.0" y2="90.0"/>
<text x="62.0" y="94.0" class="muted" font-size="11" text-anchor="end" font-weight="400">50 秒</text>
<path class="s1" d="M135.0,284.0 V279.6 Q135.0,275.6 139.0,275.6 H155.0 Q159.0,275.6 159.0,279.6 V284.0 Z"/>
<text x="147.0" y="269.6" class="t1" font-size="11" text-anchor="middle" font-weight="600">2.2</text>
<path class="s2" d="M161.0,284.0 V276.3 Q161.0,272.3 165.0,272.3 H181.0 Q185.0,272.3 185.0,276.3 V284.0 Z"/>
<text x="173.0" y="266.3" class="t1" font-size="11" text-anchor="middle" font-weight="600">3.0</text>
<text x="160.0" y="302.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">40 VU</text>
<path class="s1" d="M315.0,284.0 V271.5 Q315.0,267.5 319.0,267.5 H335.0 Q339.0,267.5 339.0,271.5 V284.0 Z"/>
<text x="327.0" y="261.5" class="t1" font-size="11" text-anchor="middle" font-weight="600">4.3</text>
<path class="s2" d="M341.0,284.0 V200.8 Q341.0,196.8 345.0,196.8 H361.0 Q365.0,196.8 365.0,200.8 V284.0 Z"/>
<text x="353.0" y="190.8" class="t1" font-size="11" text-anchor="middle" font-weight="600">22.5</text>
<text x="340.0" y="302.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">400 VU</text>
<path class="s1" d="M495.0,284.0 V255.9 Q495.0,251.9 499.0,251.9 H515.0 Q519.0,251.9 519.0,255.9 V284.0 Z"/>
<text x="507.0" y="245.9" class="t1" font-size="11" text-anchor="middle" font-weight="600">8.3</text>
<path class="s2" d="M521.0,284.0 V125.5 Q521.0,121.5 525.0,121.5 H541.0 Q545.0,121.5 545.0,125.5 V284.0 Z"/>
<text x="533.0" y="115.5" class="t1" font-size="11" text-anchor="middle" font-weight="600">41.9</text>
<text x="520.0" y="302.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">1,000 VU</text>
<line class="axis" x1="70" x2="610" y1="284" y2="284"/>
<text x="24.0" y="326.0" class="muted" font-size="11" text-anchor="start" font-weight="400">出典: CloudWatch RAIDYNC/Matchmaking MatchWaitTime（PartySize=4）を各回の時間帯全体で集計</text>
</svg>
