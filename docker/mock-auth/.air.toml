root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/mock-auth ."
  entrypoint = ["./tmp/mock-auth"]
  include_ext = ["go", "mod"]
  exclude_dir = ["tmp"]
  delay = 1000
  stop_on_error = true
  # Windows + Docker Desktop ではホストの inotify がコンテナに届かないため、
  # ファイル更新時刻のポーリングで変更を検知する
  poll = true
  poll_interval = 500

[log]
  time = true

[misc]
  clean_on_exit = true
