name: raidync

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: raidync-localstack
    environment:
      MAIN_CONTAINER_NAME: raidync-localstack
      AWS_DEFAULT_REGION: ap-northeast-1
      SERVICES: dynamodb,lambda,apigateway
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # ready.d に置いたスクリプトは LocalStack の API が応答可能になった直後に自動実行される
      - ./localstack/scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-tables.sh:ro

  # GameLift は Docker スタックに含めない。旧 GameLift Local（Java エミュレータ）は
  # Server SDK 5.x 非対応で廃止。SDK 5.x の接続検証は GameLift Anywhere（実 AWS・無料枠内）で行う。
  # ゲームサーバーの UDP 通信は GameLift 非依存でローカル単体テスト可能。詳細は docs/qa-log.md §10。

  mock-auth:
    build:
      context: ./mock-auth
      target: dev
    container_name: raidync-mock-auth
    ports:
      - "9229:9229"
    environment:
      PORT: "9229"
      MOCK_AUTH_ISSUER: "http://localhost:9229"
      MOCK_AUTH_CLIENT_ID: "raidync-local-client"
      MOCK_AUTH_TOKEN_TTL: "3600"
    volumes:
      # ソースを bind mount → air がホスト側のコード変更を検知して再ビルド
      - ./mock-auth:/app
      # Go のモジュール/ビルドキャッシュは named volume で永続化
      # （/app の bind mount に潰されない /go・/root 配下に置く）
      - mock-auth-gomod:/go/pkg/mod
      - mock-auth-gobuild:/root/.cache/go-build

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: raidync-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  localstack-data:
  mock-auth-gomod:
  mock-auth-gobuild:
